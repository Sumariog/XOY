<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>Hello Salesforce</title> 
        <Style type = "text/css">
   			div {width:100%;}
				div.left {width:50%;float:left;}
				div.right {width:50%; text-align:center; background-color:#F2F2F2;float:right;}
				form.main_F {border:3px solid black; width:700px; background-color:#585858;}
            form.sub_F {border:1px solid black; width:400px;}
            table.main_T {text-align:left;}
            H2 {color: #FFFFFF;}
            span {font-size:15pt; color:#FFFFFF;}
            li::marker {color:#FFFFFF;}
        </Style>
    </head>
    <body>
      <div>
      <!-- 좌측 영역 -->
      <div class="left">
    	<!-- Salesforce 이미지 -->
   	<img width ="200" src="https://upload.wikimedia.org/wikipedia/commons/8/89/Salesforce_Users_Email_list.png">

      <!-- 상단제목 -->
      <H1>청년CRM101 입과상담 신청하기</H1>

		<!-- form 사용 -->
      <form class="main_F">
         <!-- 첫번째 섹션 / 입력 그룹-->
			<section>
				<fieldset>
            <legend>신청 양식</legned>
				<H2>아래 희망하는 시간을 선택해주세요.(양일 신청 가능)</H2>
					<ul>
  	             <li>
							<input type="checkbox" value="30/2/3" />
    	              <span>2030년 2월 3일 </span>
							<select>
								<option value="1">1</option>
								<option value="2">2</option>
								<option value="3">3</option>
         	            <option value="4">4</option>
          	        </select>
							<span>시(오후 1시부터 5시까지 1시간 단위 진행)</span>
               </li>
               <li>
							<input type="checkbox" value="30/2/4" />
							<span>2030년 2월 4일</span>
							<select>
								<option value="10">10</option>
								<option value="11">11</option>
								<option value="1">1</option>
								<option value="2">2</option>
							</select>
                     <span>시(오전 10시부터 오후 3시까지 1시간 단위 진행)</span>                  
               </li>
					</ul>

            <H2>신청인 정보</H2>
         		<ul>
          		  <li>
							<span>이름 </span>
 	                 <input type="text" required />
  	             </li>
   	            <li>
    	              <span>직업 </span>
							<input type="text" required />
	               </li>
	               <li>
	                  <span>이메일 </span>
	                  <input type="text" required />
	               </li>
	               <li>
	                  <span>연락처 </span>
	                  <input type="text" required />
	               </li>
					</ul>          
	         </fieldset>
         </section>
         <!-- 두번째 섹션 / 입력버튼추가 -->
         <section>
            <p>
               <button type="submit"> <span>신청</span> </button>
            </p>
         </section>
      </form>
      </div>
      <!-- 우측 영역 -->   
      <div class="right">
         
   	<!-- Salesforce 이미지 -->
   	<img width ="300"  src="https://upload.wikimedia.org/wikipedia/commons/8/89/Salesforce_Users_Email_list.png">
		<form class="sub_F">
			<table class="main_T">
            <p>
            <label>
					<span style="color:#000000">사용자이름</span><br>
            </label>
            </p>
            <p>
            <input type="text" required/><br>
            </p>
            <p>
				<label>
					<span style="color:#000000">암호</span><br>
            </label>
            </p>
            <p>
            <input type="text" required/><br>
            </p>
            <p>
            <button type="submit" style="width:300px; height:60px; border-radius:2px;">로그인</button><br>
            </p>
            <p>
            <input type="checkbox" value="Y"> 로그인정보 저장
            </p>
         </table>
      </form>
      <p>
      고객이 아닙니까? <button type="submit" style="width:150px; height:60px; border-radius:2px;"> 무료 평가판</button>
      </p>
      </div>
      </div>
    </body>
</html>
